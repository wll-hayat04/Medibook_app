{% extends 'base.html' %}
{% block title %}Calendrier — MediBook{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <div class="section-divider"></div>
        <h2 class="section-title">Mon calendrier</h2>
        <p class="section-subtitle mb-0">Vue calendrier de vos rendez-vous</p>
    </div>
    <a href="{% url 'mes_rdv' %}" class="btn-primary-medibook text-decoration-none">
        <i class="bi bi-list"></i> Vue liste
    </a>
</div>

<div class="card-medibook p-3 mb-3">
    <div class="d-flex gap-3 flex-wrap">
        <span><span style="display:inline-block;width:15px;height:15px;background:#f39c12;border-radius:3px"></span> En attente</span>
        <span><span style="display:inline-block;width:15px;height:15px;background:#27ae60;border-radius:3px"></span> Confirmé</span>
        <span><span style="display:inline-block;width:15px;height:15px;background:#e74c3c;border-radius:3px"></span> Annulé</span>
        <span><span style="display:inline-block;width:15px;height:15px;background:#3498db;border-radius:3px"></span> Terminé</span>
    </div>
</div>

<div class="card-medibook p-3">
    <div id="calendar"></div>
</div>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'fr',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,listWeek'
        },
        events: {{ events_json|safe }},
        eventClick: function(info) {
            if (info.event.url) {
                window.location.href = info.event.url;
                info.jsEvent.preventDefault();
            }
        },
        height: 'auto',
        buttonText: {
            today: "Aujourd'hui",
            month: 'Mois',
            week: 'Semaine',
            list: 'Liste'
        }
    });
    calendar.render();
});
</script>
{% endblock %}
