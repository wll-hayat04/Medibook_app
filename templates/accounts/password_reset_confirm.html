{% extends 'base.html' %}
{% block title %}Nouveau mot de passe — MediBook{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card-medibook p-4">
      <div class="text-center mb-4">
        <div style="font-size:3rem">🔒</div>
        <h3 class="fw-bold" style="color:var(--primary)">Nouveau mot de passe</h3>
      </div>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Nouveau mot de passe</label>
          <input type="password" name="new_password1" class="form-control form-control-medibook" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Confirmer le mot de passe</label>
          <input type="password" name="new_password2" class="form-control form-control-medibook" required>
        </div>
        <button type="submit" class="btn-primary-medibook w-100">
          <i class="bi bi-check-circle"></i> Changer le mot de passe
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
