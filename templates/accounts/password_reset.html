{% extends 'base.html' %}
{% block title %}Réinitialisation mot de passe — MediBook{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card-medibook p-4">
      <div class="text-center mb-4">
        <div style="font-size:3rem">🔑</div>
        <h3 class="fw-bold" style="color:var(--primary)">Mot de passe oublié ?</h3>
        <p class="text-muted">Entrez votre email et nous vous enverrons un lien de réinitialisation.</p>
      </div>
      <form method="post">
        {% csrf_token %}
        <div class="mb-4">
          <label class="form-label fw-semibold">Adresse email</label>
          <input type="email" name="email" class="form-control form-control-medibook"
                 placeholder="votre@email.com" required>
        </div>
        <button type="submit" class="btn-primary-medibook w-100">
          <i class="bi bi-envelope"></i> Envoyer le lien
        </button>
      </form>
      <p class="text-center mt-3">
        <a href="{% url 'connexion' %}" style="color:var(--primary)">
          <i class="bi bi-arrow-left"></i> Retour à la connexion
        </a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
