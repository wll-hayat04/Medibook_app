{% extends 'base.html' %}
{% block title %}Email envoyé — MediBook{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card-medibook p-4 text-center">
      <div style="font-size:4rem">📧</div>

    </div>
  </div>

{% endblock %}
