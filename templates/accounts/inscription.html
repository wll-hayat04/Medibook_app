{% extends 'base.html' %}
{% block title %}Inscription — MediBook{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-medibook p-4">
            <div class="text-center mb-4">
                <div style="font-size:3rem">👤</div>
                <h3 class="fw-bold" style="color:var(--primary)">Créer un compte patient</h3>
                <p class="text-muted">Rejoignez MediBook gratuitement</p>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Prénom</label>
                        <input type="text" name="prenom" class="form-control form-control-medibook" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Nom</label>
                        <input type="text" name="nom" class="form-control form-control-medibook" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nom d'utilisateur</label>
                    <input type="text" name="username" class="form-control form-control-medibook" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="email" class="form-control form-control-medibook" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Mot de passe</label>
                    <input type="password" name="password1" class="form-control form-control-medibook" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Confirmer le mot de passe</label>
                    <input type="password" name="password2" class="form-control form-control-medibook" required>
                </div>
                <button type="submit" class="btn-primary-medibook w-100">
                    <i class="bi bi-person-plus"></i> Créer mon compte
                </button>
            </form>
            <p class="text-center mt-3 text-muted">
                Déjà un compte ? <a href="{% url 'connexion' %}" style="color:var(--primary)">Se connecter</a>
            <p class="text-center mt-2 text-muted">
                Vous etes medecin ? <a href="{% url 'inscription_medecin' %}" style="color:var(--primary)">Inscription medecin</a>
            </p>
            </p>
        </div>
    </div>
</div>
{% endblock %}
