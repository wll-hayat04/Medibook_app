{% extends 'base.html' %}
{% block title %}Mot de passe changé — MediBook{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card-medibook p-4 text-center">
      <div style="font-size:4rem">✅</div>
      <h3 class="fw-bold mt-3" style="color:var(--secondary)">Mot de passe changé !</h3>
      <p class="text-muted">Votre mot de passe a été réinitialisé avec succès.</p>
      <a href="{% url 'connexion' %}" class="btn-primary-medibook text-decoration-none d-inline-block mt-2">
        <i class="bi bi-box-arrow-in-right"></i> Se connecter
      </a>
    </div>
  </div>
</div>
{% endblock %}
