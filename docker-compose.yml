services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: medibook_db
      POSTGRES_USER: medibook_user
      POSTGRES_PASSWORD: medibook_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: gunicorn medibook_project.wsgi:application --bind 0.0.0.0:8091
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8091:8091"
    env_file:
      - .env
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume: